# Configuration Mosquitto pour le développement local.
# Écoute sur le port MQTT standard et autorise les connexions anonymes
# (suffisant en dev ; à sécuriser pour un vrai déploiement).

listener 1883
allow_anonymous true

# Persistance : les sessions persistantes (détection, notification) et leurs messages QoS 1
# en attente survivent à un redémarrage du broker (voir docs/topics-mqtt.md, risque R9).
# Limite : Mosquitto écrit sur disque périodiquement (autosave_interval, 30 min par défaut) et à
# l'arrêt propre, pas à chaque message : un arrêt brutal perd ce qui n'a pas encore été sauvegardé.
persistence true
persistence_location /mosquitto/data/
