# CI : se déclenche à chaque push, sur toutes les branches.
# Les résultats s'affichent aussi sur la pull request de la branche.
#
#   infra : docker-compose.yml valide avec les variables de .env.example
#   tests : sur Node 22 et 24 (versions LTS)
#     - typecheck  : tous les workspaces TypeScript compilent en mode strict
#     - npm test   : tests de tous les workspaces, dont
#         * contrat d'événements (packages/shared-types) : exemples de docs/format-evenements.md,
#           JSON Schemas, enums TypeScript et sortie du flow Node-RED vérifiés ensemble
#         * détection (services/detection) : règles du scénario A du DDD
#
# Un nouveau service avec un script "test" ou "typecheck" est pris en compte automatiquement.

name: CI

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valider docker-compose
        run: |
          cp .env.example .env
          docker compose config --quiet && echo "docker-compose valide"

      # Construit les images des services (vérifie les Dockerfile)
      - name: Construire les images
        run: docker compose build

      # Démarre le broker et la détection, envoie une chute et vérifie que l'alerte de niveau 1 est publiée
      - name: Test de bout en bout (broker + détection)
        run: |
          docker compose up -d mosquitto detection
          for i in $(seq 1 30); do
            docker compose logs detection | grep -q "connecté et abonné" && break
            sleep 1
          done
          docker compose exec -T mosquitto sh -c '
            mosquitto_sub -h localhost -t "alerts/#" -C 1 -W 15 > /tmp/alert.json &
            sleep 1
            mosquitto_pub -h localhost -q 1 -t signals/senior-001/FALL_IMPACT -m "{\"eventId\":\"a1b2c3d4-0000-4000-8000-000000000001\",\"seniorId\":\"senior-001\",\"sensorId\":\"watch-001\",\"type\":\"FALL_IMPACT\",\"timestamp\":\"2026-01-15T14:32:08.000Z\",\"payload\":{\"value\":9.8,\"unit\":\"g\"}}"
            wait
            cat /tmp/alert.json
            grep -q PreConfirmationRequested /tmp/alert.json'

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêter
        if: always()
        run: docker compose down -v

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22, 24 ]
    name: tests (Node ${{ matrix.node-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types (tous les workspaces)
        run: npm run typecheck

      - name: Tests (contrat d'événements, détection)
        run: npm test
