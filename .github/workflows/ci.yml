# CI : se déclenche à chaque push, sur toutes les branches.
# Les résultats s'affichent aussi sur la pull request de la branche.
#
#   infra : docker-compose.yml valide, images construites, puis scénario de chute de bout en bout
#           sur la pile complète (Node-RED, détection, API, broker, base), délais raccourcis
#   tests : sur Node 22 et 24 (versions LTS)
#     - typecheck  : tous les workspaces TypeScript compilent en mode strict
#     - npm test   : tests de tous les workspaces, dont
#         * contrat d'événements (packages/shared-types) : exemples de docs/format-evenements.md,
#           JSON Schemas, enums TypeScript et sortie du flow Node-RED vérifiés ensemble
#         * détection (services/detection) : règles du scénario A du DDD, intégration MQTT
#         * API (apps/api-gateway) : journal des alertes, règles d'accès, projections par rôle
#
# Un nouveau service avec un script "test" ou "typecheck" est pris en compte automatiquement.

name: CI

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest
    env:
      PRE_CONFIRMATION_DELAY_S: 6
      RECOVERY_WINDOW_S: 8
      CRITICAL_ESCALATION_DELAY_S: 6
      INACTIVITY_CHECK_INTERVAL_S: 5
      ABSENCE_GRACE_S: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sans fichier .env, comme sur la machine de l'enseignant
      - name: Valider docker-compose
        run: docker compose config --quiet && echo "docker-compose valide"

      # Construit les images des services (vérifie les Dockerfile)
      - name: Construire les images
        run: docker compose build

      - name: Démarrer la pile complète
        run: docker compose up -d --wait

      - name: Installer Node.js (client du scénario)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Une chute envoyée par la « montre » traverse Node-RED, la détection et l'API :
      # niveaux 1, 2 et 3, ce que voit chaque rôle (temps réel et REST), règles d'accès, prise en charge ;
      # puis l'inactivité avec un seuil d'une minute fixé par le médical, une absence déclarée, et une batterie faible.
      - name: Scénario de chute de bout en bout
        run: node apps/api-gateway/test/e2e/fall-scenario.e2e.mjs

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêter
        if: always()
        run: docker compose down -v

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 22, 24 ]
    name: tests (Node ${{ matrix.node-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types (tous les workspaces)
        run: npm run typecheck

      - name: Tests (contrat d'événements, détection, API)
        run: npm test
