# Infrastructure et services du projet.
# Les services métier (api-gateway, notification, application web) seront ajoutés au fur et à mesure.
#
# Lancement :  docker compose up --build
# Arrêt      :  docker compose down
# Les identifiants viennent du fichier .env (copier .env.example en .env au premier lancement).

services:

  # --- Broker MQTT : capteurs (via Zigbee2MQTT) et messagerie interne ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"          # port MQTT standard
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data   # sessions persistantes et messages QoS 1 en attente
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  # --- Base de données relationnelle ---
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # port hôte surchargeable (ex. si un Postgres local occupe déjà 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data   # persistance des données entre les redémarrages
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  # --- Passerelle d'ingestion ---
  node-red:
    image: nodered/node-red:4.1.12   # version fixée : un build donne toujours le même résultat
    container_name: node-red
    ports:
      - "1880:1880"          # interface web de Node-RED
    volumes:
      - ./services/ingestion:/data   # monte la config (settings.js) et les flows
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # --- Détection (corrélation des signaux, levée de doute, alertes) ---
  detection:
    build:
      context: .
      dockerfile: services/detection/Dockerfile
    container_name: detection
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: detection
      # Valeurs de détection (ADR 0003 à 0005). Raccourcir les délais dans .env pour une démonstration.
      FALL_MIN_IMPACT_G: ${FALL_MIN_IMPACT_G:-3.0}
      PRE_CONFIRMATION_DELAY_S: ${PRE_CONFIRMATION_DELAY_S:-60}
      RECOVERY_WINDOW_S: ${RECOVERY_WINDOW_S:-90}
      CRITICAL_ESCALATION_DELAY_S: ${CRITICAL_ESCALATION_DELAY_S:-300}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # --- API : point d'entrée unique de l'application web (REST + WebSocket), historique ---
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: api-gateway
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

# --- Réseau commun : permet aux services de se joindre par leur nom ---
networks:
  app-network:
    driver: bridge

volumes:
  pgdata:           # données PostgreSQL
  mosquitto-data:   # persistance du broker MQTT
