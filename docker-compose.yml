# Socle d'infrastructure (version minimaliste).
# Lance uniquement l'infrastructure réelle : broker MQTT, base de données, passerelle Node-RED.
# Les services métier (api-gateway, detection, notification) seront ajoutés ici au fur et à mesure.
#
# Lancement :  docker compose up
# Arrêt      :  docker compose down
# Les identifiants viennent du fichier .env (copier .env.example en .env au premier lancement).

services:

  # --- Broker MQTT : point d'entrée des capteurs ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"          # port MQTT standard
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - app-network

  # --- Base de données relationnelle ---
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # port hôte surchargeable (ex. si un Postgres local occupe déjà 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data   # persistance des données entre les redémarrages
    networks:
      - app-network

  # --- Passerelle d'ingestion ---
  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    ports:
      - "1880:1880"          # interface web de Node-RED
    volumes:
      - ./services/ingestion:/data   # monte la config (settings.js) et les flows
    depends_on:
      - mosquitto
    networks:
      - app-network

# --- Réseau commun : permet aux services de se joindre par leur nom ---
networks:
  app-network:
    driver: bridge

# --- Volume persistant pour PostgreSQL ---
volumes:
  pgdata: