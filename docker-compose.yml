# Infrastructure et services du projet.
# Application web : http://localhost:8080 (vues senior, famille, médical).
#
# Lancement :  docker compose up --build
# Arrêt      :  docker compose down
# Les identifiants viennent du fichier .env (copier .env.example en .env au premier lancement).

services:

  # --- Broker MQTT : capteurs (via Zigbee2MQTT) et messagerie interne ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"          # port MQTT standard
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data   # sessions persistantes et messages QoS 1 en attente
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  # --- Base de données relationnelle ---
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # port hôte surchargeable (ex. si un Postgres local occupe déjà 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data   # persistance des données entre les redémarrages
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  # --- Passerelle d'ingestion ---
  node-red:
    image: nodered/node-red:4.1.12   # version fixée : un build donne toujours le même résultat
    container_name: node-red
    ports:
      - "1880:1880"          # interface web de Node-RED
    environment:
      FLOWS: /flows/flows.json   # variable de l'image Node-RED : flows lus et enregistrés dans le dépôt
    volumes:
      # État d'exécution (modules, clé de chiffrement, contexte) dans un volume Docker : le conteneur
      # (utilisateur 1000) peut y écrire quel que soit le propriétaire du dossier du dépôt sur la machine.
      - node-red-data:/data
      - ./services/ingestion/settings.js:/data/settings.js:ro   # configuration, en lecture seule
      - ./services/ingestion:/flows                              # flows du dépôt (modifiables depuis l'éditeur)
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # --- Détection (corrélation des signaux, levée de doute, alertes) ---
  detection:
    build:
      context: .
      dockerfile: services/detection/Dockerfile
    container_name: detection
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: detection
      # Valeurs de détection (ADR 0003 à 0005). Raccourcir les délais dans .env pour une démonstration.
      FALL_MIN_IMPACT_G: ${FALL_MIN_IMPACT_G:-3.0}
      PRE_CONFIRMATION_DELAY_S: ${PRE_CONFIRMATION_DELAY_S:-60}
      RECOVERY_WINDOW_S: ${RECOVERY_WINDOW_S:-90}
      CRITICAL_ESCALATION_DELAY_S: ${CRITICAL_ESCALATION_DELAY_S:-300}
      # Inactivité (ADR 0010) : seuils lus à l'API au démarrage, puis mis à jour par message (profiles/+).
      API_URL: http://api-gateway:3000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token-change-me}
      INACTIVITY_CHECK_INTERVAL_S: ${INACTIVITY_CHECK_INTERVAL_S:-60}
      HEART_RATE_FRESHNESS_S: ${HEART_RATE_FRESHNESS_S:-600}
      # Surveillance des capteurs (ADR 0012) : vérification des capteurs muets, seuil de batterie faible.
      SENSOR_CHECK_INTERVAL_S: ${SENSOR_CHECK_INTERVAL_S:-60}
      LOW_BATTERY_PERCENT: ${LOW_BATTERY_PERCENT:-20}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # --- Notification : qui prévenir selon la gravité d'une alerte (ADR 0008) ---
  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: notification
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: notification
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # --- API : point d'entrée unique de l'application web (REST + WebSocket), historique ---
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: api-gateway
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      NODE_RED_URL: http://node-red:1880   # actions du senior (« tout va bien », « aide »), ADR 0007
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token-change-me}   # clé de la détection pour /internal (ADR 0010)
      ABSENCE_GRACE_S: ${ABSENCE_GRACE_S:-900}   # un mouvement au domicile termine l'absence après ce délai (ADR 0011)
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      node-red:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  # --- Application web : une application, trois vues ; nginx relaie /api et /socket.io vers l'API ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web
    ports:
      - "${WEB_PORT:-8080}:80"   # port hôte surchargeable (ex. si un autre service occupe déjà 8080)
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

# --- Réseau commun : permet aux services de se joindre par leur nom ---
networks:
  app-network:
    driver: bridge

volumes:
  pgdata:           # données PostgreSQL
  mosquitto-data:   # persistance du broker MQTT
  node-red-data:    # état d'exécution de Node-RED (modules, clé, contexte)
