# Sert l'application construite et relaie l'API sur la même origine (pas de requêtes d'origine croisée).
#   /api/...      -> api-gateway:3000/...   (REST)
#   /socket.io/   -> api-gateway:3000       (temps réel, WebSocket)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Résolution du nom au moment de la requête : nginx démarre même si l'API n'est pas encore prête.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api-gateway:3000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Fichiers à nom versionné : mis en cache longtemps. index.html : jamais (nouvelle version visible tout de suite).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
